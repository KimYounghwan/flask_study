<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>책 등록</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 40px;
    }

    .container {
      width: 400px;
      margin: auto;
      background: white;
      padding: 30px;
      border: 1px solid #ccc;
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      background-color: #3498db;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #2980b9;
    }
  </style>
</head>

<body>

  <div class="container">

    <h2>책 등록</h2>

    <form action="/book/insert" method="post">

      <div class="form-group">
        <label>ISBN</label>
        <input type="text" name="isbn">
      </div>

      <div class="form-group">
        <label>도서제목</label>
        <input type="text" name="title">
      </div>

      <div class="form-group">
        <label>저자</label>
        <input type="text" name="author">
      </div>

      <div class="form-group">
        <label>출판사</label>
        <input type="text" name="publisher">
      </div>

      <div class="form-group">
        <label>출판날짜</label>
        <input type="date" name="publish_date">
      </div>

      <div class="form-group">
        <label>가격</label>
        <input type="number" name="price">
      </div>

      <button type="submit">
        등록하기
      </button>

    </form>

  </div>

</body>
</html>
