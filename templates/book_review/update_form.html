{% extends "book_review_main/base.html" %}

{% block style %}
<style>

  .content {
    padding: 40px;
  }

  h2 {
    margin-bottom: 20px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th,
  td {
    border: 1px solid #ccc;
    padding: 12px;
    text-align: center;
  }

  th {
    background-color: #f0f0f0;
    width: 120px;
  }

  td {
    text-align: left;
  }

  input[type="text"],
  select,
  textarea {
    width: 100%;
    padding: 8px;
    border: 1px solid #ccc;
    font-size: 14px;
    box-sizing: border-box;
  }

  textarea {
    min-height: 200px;
    resize: vertical;
  }

  .btn {
    display: inline-block;
    padding: 10px 20px;
    background-color: #3498db;
    color: white;
    text-decoration: none;
    border: none;
    cursor: pointer;
    font-size: 14px;
  }

  .btn:hover {
    background-color: #2980b9;
  }

  .btn-area {
    text-align: center;
    margin-top: 20px;
  }

  .btn-area .btn {
    margin: 0 5px;
  }

  .btn-cancel {
    background-color: #95a5a6;
  }

  .btn-cancel:hover {
    background-color: #7f8c8d;
  }

</style>
{% endblock %}

{% block content %}

<div class="content">

  <h2>독후감 수정</h2>

  <form action="/book_review/update/{{ review.review_id }}" method="POST">

    <table>
      <tr>
        <th>독후감번호</th>
        <td>
          {{ review.review_id }}
          <input type="hidden" name="review_id" value="{{ review.review_id }}">
        </td>
      </tr>
      <tr>
        <th>도서선택</th>
        <td>
          <select name="book_id" required disabled>
            <option value="">-- 도서를 선택하세요 --</option>
            {% for book in book_list %}
            <option value="{{ book.book_id }}"
              {% if book.book_id == review.book_id %}selected{% endif %}>
              {{ book.title }} ({{ book.author }})
            </option>
            {% endfor %}
          </select>
        </td>
      </tr>
      <tr>
        <th>내용</th>
        <td>
          <textarea name="content" required>{{ review.content }}</textarea>
        </td>
      </tr>
    </table>

    <div class="btn-area">
      <a href="/book_review/list" class="btn btn-cancel">취소</a>
      <button type="submit" class="btn">수정</button>
    </div>

  </form>

</div>

{% endblock %}
