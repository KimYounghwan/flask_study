{% extends "book_review_main/base.html" %}

{% block style %}
  <title>책 수정</title>

  <style>


    h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      background-color: #3498db;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #2980b9;
    }
  </style>
{% endblock %}

{% block content %}
    <h2>책 수정</h2>

    <form action="/book/update/{{book.book_id}}" method="post">

      <div class="form-group">
        <label>도서번호</label>
        <input type="text" name="book_id" value="{{book.book_id}}" readonly>
      </div>
 
      <div class="form-group">
        <label>ISBN</label>
        <input type="text" name="isbn" value="{{book.isbn}}">
      </div>

      <div class="form-group">
        <label>도서제목</label>
        <input type="text" name="title" value="{{book.title}}">
      </div>

      <div class="form-group">
        <label>저자</label>
        <input type="text" name="author" value="{{book.author}}">
      </div>

      <div class="form-group">
        <label>출판사</label>
        <input type="text" name="publisher" value="{{book.publisher}}">
      </div>

      <div class="form-group">
        <label>출판날짜</label>
        <input type="date" name="publish_date" value="{{book.publish_date}}">
      </div>

      <div class="form-group">
        <label>가격</label>
        <input type="number" name="price" value="{{book.price}}">
      </div>

      <button type="submit">
        수정하기
      </button>

    </form>

{% endblock %}
