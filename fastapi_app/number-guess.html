<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>숫자맞추기 게임</title>
    <style>
        /* 이미지와 유사한 회색 배경 및 중앙 정렬 스타일링 */
        body {
            background-color: #e6e6e6;
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .game-container {
            text-align: center;
            width: 100%;
            max-width: 500px;
        }

        h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 10px;
            font-weight: normal;
        }

        p {
            font-size: 20px;
            color: #555;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        /* 숫자 입력창 스타일 */
        input[type="number"] {
            width: 150px;
            height: 35px;
            font-size: 18px;
            border: 1px solid #777;
            padding: 0 5px;
            box-sizing: border-box;
        }

        /* 확인 버튼 스타일 */
        button {
            height: 35px;
            padding: 0 20px;
            font-size: 18px;
            background-color: #f0f0f0;
            border: 1px solid #777;
            cursor: pointer;
        }

        button:hover {
            background-color: #e0e0e0;
        }

        /* 결과 확인 메시지 영역 스타일 */
        .result {
            font-size: 20px;
            color: #444;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>숫자맞추기 게임</h1>
        <p>1~100 사이 숫자를 입력하세요</p>
        
        <div class="input-group">
            <input type="number" id="guessInput" min="1" max="100">
            <button onclick="checkGuess()">확인</button>
        </div>

        <div class="result" id="resultMessage">결과확인</div>
    </div>

    <script>
        function checkGuess(){
            let input = document.querySelector("#guessInput")
            let num = input.value;
            input.value = ""
            
            let result = send_number(num)
            let msg = document.querySelector("#resultMessage")
            msg.innerHTML = result
        }
        function send_number(num){
            xhr = new XMLHttpRequest()
            xhr.open(
                "GET",
                "http://localhost:8000/guess/"+num,
                false  //비동기통신 여부
            )
            xhr.send() //통신
            data = JSON.parse(xhr.responseText)
            return data.result
        } 
        
        // async function checkGuess(){
        //     let input = document.querySelector("#guessInput")
        //     let num = input.value;
        //     input.value = ""
            
        //     let result = await send_number(num)
        //     let msg = document.querySelector("#resultMessage")
        //     msg.innerHTML = result
        // }
        // async function send_number(num){
        //     res = await fetch("http://localhost:8000/guess/"+num)
        //     data = await res.json()
        //     return data.result
        // }
    </script>

</body>
</html>
