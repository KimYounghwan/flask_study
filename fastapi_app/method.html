<button onclick="getItem()">GET 조회</button>
<button onclick="createItem()">POST 생성</button>
<button onclick="updateItem()">PUT 수정</button>
<button onclick="deleteItem()">DELETE 삭제</button>

<script>
// ============================================
// 1. GET - 데이터 조회
// ============================================
function getItem() {
    fetch('http://127.0.0.1:8000/items')
        .then(res => res.json())
        .then(data => console.log(data));
}

// ============================================
// 2. POST - 데이터 생성
// ============================================
function createItem() {
    fetch('http://127.0.0.1:8000/items', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            name: '사과',
            price: 1000
        })
    })
    .then(res => res.json())
    .then(data => console.log(data));
}

// ============================================
// 3. PUT - 데이터 수정
// ============================================
function updateItem() {
    fetch('http://127.0.0.1:8000/items/1', {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            name: '수정된사과',
            price: 1500
        })
    })
    .then(res => res.json())
    .then(data => console.log(data));
}

// ============================================
// 4. DELETE - 데이터 삭제
// ============================================
function deleteItem() {
    fetch('http://127.0.0.1:8000/items/1', {
        method: 'DELETE'
    })
    .then(res => res.json())
    .then(data => console.log(data));
}
</script>
