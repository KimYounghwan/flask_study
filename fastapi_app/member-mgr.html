<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 관리 시스템</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f5f7fb;
            color: #333;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* 내비게이션 탭 스타일 */
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }

        .tab-btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #e2e8f0;
            color: #475569;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            background-color: #cbd5e1;
        }

        /* 카드 공통 스타일 */
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 32px;
        }

        .card-title {
            font-size: 20px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 24px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 12px;
        }

        /* --------------------------------------------------
           ★ 핵심: 자바스크립트 없는 화면 전환 라우팅 
        -------------------------------------------------- */
        /* 기본 상태: 모든 페이지를 숨김 */
        #register-page, #list-page {
            display: none;
        }

        /* 1. URL 끝이 #register 일 때 등록 페이지 표시 */
        #register-page:target {
            display: block;
        }

        /* 2. URL 끝이 #list 일 때 목록 페이지 표시 */
        #list-page:target {
            display: block;
        }

        /* 3. 처음 접속했을 때(앵커가 없을 때) 기본값으로 목록 페이지를 표시 */
        #register-page {
            display: block;
        }
        /* 다만 다른 곳이 타겟팅 되면 기본 표시해둔 목록을 숨김 */
        body:has(#register-page:target) #list-page {
            display: none;
        }

        /* 활성화된 탭 버튼 시각 효과 (CSS 상위 선택자 활용) */
        body:has(#register-page:target) .btn-reg-tab,
        body:not(:has(#register-page:target)) .btn-list-tab {
            background-color: #3b82f6;
            color: #fff;
        }


        /* 폼 스타일 */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #475569;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #3b82f6;
        }

        .btn-submit {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background-color: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        /* 테이블 스타일 */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th {
            background-color: #f8fafc;
            color: #64748b;
            font-weight: 600;
            padding: 14px 16px;
            border-bottom: 2px solid #e2e8f0;
        }

        td {
            padding: 16px 16px;
            border-bottom: 1px solid #e2e8f0;
            color: #334155;
        }

        tr:hover td {
            background-color: #f8fafc;
        }

        .action-links a {
            font-size: 13px;
            text-decoration: none;
            margin-right: 10px;
        }
        .edit-link { color: #059669; }
        .delete-link { color: #dc2626; }
    </style>
</head>
<body>

<div class="container">
    <!-- 상단 탭 메뉴 (A 태그의 href와 각 페이지 id를 매칭) -->
    <nav class="nav-tabs">
        <a href="#list" class="tab-btn btn-list-tab">회원 목록</a>
        <a href="#register" class="tab-btn btn-reg-tab">회원 등록</a>
    </nav>

    <!-- [페이지 1] 회원 등록 화면 -->
    <div id="register-page" class="card">
        <h2 class="card-title">신규 회원 등록</h2>
        <form action="/user/register" method="POST">
            <div class="form-group">
                <label for="username">사용자명</label>
                <input type="text" id="username" name="username" placeholder="아무개">
            </div>
            <div class="form-group">
                <label for="age">나이</label>
                <input type="number" id="age" name="age" min="1" max="99" placeholder="1 ~ 99 사이 입력">
            </div>
            <button type="submit" class="btn-submit">등록하기</button>
        </form>
    </div>

    <!-- [페이지 2] 회원 목록 화면 -->
    <div id="list-page" class="card">
        <h2 class="card-title">회원 목록</h2>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID (user_id)</th>
                        <th>사용자명 (username)</th>
                        <th>나이 (age)</th>
                        <th>관리</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>107</td>
                        <td>홍길동</td>
                        <td>25</td>
                        <td class="action-links">
                            <a href="/user/edit/107" class="edit-link">수정</a>
                            <a href="/user/delete/107" class="delete-link">삭제</a>
                        </td>
                    </tr>
                    <tr>
                        <td>108</td>
                        <td>아무개</td>
                        <td>30</td>
                        <td class="action-links">
                            <a href="/user/edit/108" class="edit-link">수정</a>
                            <a href="/user/delete/108" class="delete-link">삭제</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
