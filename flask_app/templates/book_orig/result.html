<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 50px;
    }

    .container {
      width: 400px;
      margin: auto;
      background: white;
      padding: 40px;
      text-align: center;
      border: 1px solid #ccc;
    }

    h2 {
      color: #2ecc71;
      margin-bottom: 20px;
    }

    p {
      margin-bottom: 30px;
      font-size: 18px;
    }

    a {
      display: inline-block;
      padding: 12px 25px;
      background-color: #3498db;
      color: white;
      text-decoration: none;
    }

    a:hover {
      background-color: #2980b9;
    }

  </style>
</head>

<body>

  <div class="container">

    <h2>{{title}}</h2>

    <p>
      {{msg}}
    </p>

    <a href="{{link}}">
      {{link_text}}
    </a>

  </div>

</body>
</html>
