{% extends "book_review_main/base.html" %}

{% block style %}
<style>

  .content {
    padding: 40px;
  }

  h2 {
    margin-bottom: 20px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 20px;
  }

  th,
  td {
    border: 1px solid #ccc;
    padding: 12px;
    text-align: center;
  }

  th {
    background-color: #f0f0f0;
    width: 120px;
  }

  .review-box {
    border: 1px solid #ccc;
    padding: 20px;
    font-size: 16px;
    line-height: 1.6;
    min-height: 100px;
    white-space: pre-wrap;
    margin-bottom: 20px;
  }

  .btn {
    display: inline-block;
    padding: 10px 20px;
    background-color: #3498db;
    color: white;
    text-decoration: none;
    border: none;
    cursor: pointer;
    font-size: 14px;
  }

  .btn:hover {
    background-color: #2980b9;
  }

  .btn-area {
    text-align: center;
    margin-top: 10px;
  }

  .btn-area .btn {
    margin: 0 5px;
  }

  /* 삭제 모달 */
  .modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    justify-content: center;
    align-items: center;
  }

  .modal.on {
    display: flex;
  }

  .modal-box {
    background: white;
    border: 2px solid #333;
    padding: 30px;
    text-align: center;
  }

  .modal-box p {
    margin-bottom: 20px;
    font-size: 16px;
  }

</style>
{% endblock %}

{% block content %}

<div class="content">

  <h2>독후감 상세보기</h2>

  <!-- 도서 정보 -->
  <table>
    <tr>
      <th>도서제목</th>
      <td>{{ book.title }}</td>
    </tr>
    <tr>
      <th>저자</th>
      <td>{{ book.author }}</td>
    </tr>
  </table>

  <!-- 독후감 정보 -->
  <table>
    <tr>
      <th>독후감번호</th>
      <td>{{ review.review_id }}</td>
    </tr>
    <tr>
      <th>작성일</th>
      <td>{{ review.created_at.strftime('%Y-%m-%d %H:%M') }}</td>
    </tr>
  </table>

  <!-- 독후감 내용 -->
  <div class="review-box">
    {{ review.content }}
  </div>

  <!-- 버튼 -->
  <div class="btn-area">
    <a href="/book_review/list" class="btn">목록</a>
    <a href="/book_review/update/{{ review.review_id }}" class="btn">수정</a>
    <button type="button" class="btn" onclick="modalOn()">삭제</button>
  </div>

</div>

<!-- 삭제 확인 모달 -->
<div class="modal" id="modal">
  <div class="modal-box">
    <p>정말 삭제하시겠습니까?</p>
    <button class="btn" onclick="modalOff()">취소</button>
    <form action="/book_review/delete/{{ review.review_id }}" method="POST" style="display: inline;">
      <button type="submit" class="btn">삭제</button>
    </form>
  </div>
</div>

<script>
  function modalOn() {
    document.getElementById('modal').classList.add('on');
  }

  function modalOff() {
    document.getElementById('modal').classList.remove('on');
  }
</script>

{% endblock %}
